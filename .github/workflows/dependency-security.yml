name: Dependency security and compatibility
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * 1'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      GOOGLE_CLOUD_PROJECT: offline-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --frozen --all-groups
      - run: uv run python -m unittest discover -s tests -v
      - run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes > /tmp/audit-requirements.txt
          uvx pip-audit -r /tmp/audit-requirements.txt --no-deps --disable-pip --strict
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=low
