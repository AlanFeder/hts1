# Group all dependency updates per ecosystem; security updates use their own group.
version: 2
updates:
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
