[project]
name = "hts-classifier"
version = "0.1.0"
description = "HTS tariff code classifier using AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.70.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "fastapi[standard]>=0.135.3",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "idna>=3.15",
    "requests>=2.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.28",
]
[tool.ruff.lint]
extend-select = [
    "I",   # isort
]
